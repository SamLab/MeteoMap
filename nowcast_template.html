<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Спутник — наукастинг — MeteoMap</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#acacac;color:#42434b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
#map{position:absolute;inset:0;background:#acacac}
#sattimeline{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:#fff;border-top:1px solid #d8d8d8;padding:8px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 -1px 3px rgba(0,0,0,.15)}
#sattimeline.hidden{display:none}
#satplay{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 2px 2px rgba(85,85,85,.4);color:#42434b;font-size:14px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;border:0}
#satplay:hover{background:#f2f2f2}
#satsegwrap{flex:1;position:relative;height:10px;cursor:pointer}
#satsegs{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;gap:1px}
#satsegs div{flex:1;position:relative;cursor:pointer}
#satsegs div:after{content:'';display:block;position:absolute;background-color:#42434b;opacity:.35;left:0;right:0;top:0;bottom:0;border-radius:2px}
#satsegs div.on:after{opacity:1}
#satsegs div:first-child:after{border-radius:9px 2px 2px 9px}
#satsegs div:last-child:after{border-radius:2px 9px 9px 2px}
#sattime{font-size:12px;color:#fff;min-width:66px;text-align:center;padding:2px 8px;background-color:#4a6d5a;border-radius:10px;flex:none;font-variant-numeric:tabular-nums}
#status{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;background:#fff;border:1px solid #d8d8d8;color:#42434b;border-radius:8px;padding:6px 14px;font-size:12px;display:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
#status.show{display:block}
#ltoggle{position:absolute;top:10px;right:10px;z-index:1000;background:#42434b;color:#fff;border:0;border-radius:18px;padding:6px 14px;font-size:12px;cursor:pointer;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.3);display:flex;align-items:center;gap:6px}
#ltoggle.on{background:#f29b17;color:#fff}
#ltoggle .ltdot{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block}
/*__LEAFLET_CSS__*/
.leaflet-container{background:#acacac}
.leaflet-bar a,.leaflet-bar a:hover{background-color:#42434b;width:35px;height:35px;line-height:35px;text-align:center;text-decoration:none;color:#fff;margin-bottom:10px;border-radius:50%;font-size:28px}
.leaflet-bar a.leaflet-disabled{cursor:default;background-color:#42434b;color:#5f6065}
.leaflet-container .leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.8);color:#666}
.leaflet-container .leaflet-control-attribution a{color:#415fad}
.leaflet-labels-pane{z-index:900}
.label{position:absolute;pointer-events:none}
.label::before{content:" ";position:absolute;left:-3px;bottom:-3px;border:1px solid #000;border-radius:50%;width:6px;height:6px;background-color:#eee}
.label>span{position:absolute;left:-9px;bottom:5px;white-space:nowrap;color:#fff;font-weight:500;text-shadow:-1px 0 1px rgba(0,0,0,.7),1px 0 1px rgba(0,0,0,.7),0 1px 1px rgba(0,0,0,.7),0 -1px 1px rgba(0,0,0,.7)}
.label.l0>span{font-size:13px}
.label.l1>span{font-size:12px}
.label.l2>span{font-size:11px}
.label.l3>span,.label.l4>span{font-size:10px}
.label.l1::before,.label.l2::before{left:-2px;bottom:-2px;width:4px;height:4px}
.label.l3::before,.label.l4::before{left:-1px;bottom:-1px;width:2px;height:2px}
.label.l3 span,.label.l4 span{left:-7px}
.leaflet-lightning-0-pane,.leaflet-lightning-1-pane{filter:sepia(1) hue-rotate(330deg) saturate(12) brightness(2) drop-shadow(0 0 3px #ff003c) drop-shadow(0 0 6px #ff003c)}
.leaflet-lightning-1-pane{filter:sepia(1) hue-rotate(330deg) saturate(8) brightness(1.6) drop-shadow(0 0 3px #cc0033) drop-shadow(0 0 5px #cc0033)}
</style>
</head>
<body>
<div id="map"></div>
<div id="status"></div>
<button id="ltoggle" title="Молнии: свежие — светло-голубые, постарше — тёмно-голубые"><span class="ltdot"></span>Молнии</button>
<div id="sattimeline" class="hidden">
  <button id="satplay" title="Воспроизвести историю спутника (последние ~6 ч)">▶</button>
  <div id="satsegwrap"><div id="satsegs"></div></div>
  <span id="sattime">—</span>
</div>
<script>
/*__LEAFLET__*/
</script>
<script>
/*__PALETTE__*/
</script>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var lat=parseFloat(params.get('lat'))||57.63;
  var lon=parseFloat(params.get('lon'))||39.87;
  var zoom=parseInt(params.get('zoom')||'3',10);
  var map=L.map('map',{zoomControl:true,minZoom:3,maxZoom:8,fadeAnimation:false}).setView([lat,lon],zoom);
  setTimeout(function(){
    if(map.getContainer().offsetWidth===0||map.getContainer().offsetHeight===0)map.invalidateSize();
  },50);

  L.tileLayer('https://rainradar.ru/tiles?z={z}&x={x}&y={y}',{
    tms:true,minZoom:3,maxZoom:10,zIndex:998
  }).addTo(map);

  // ---- Облачность: живой слой Sat24 (кадры раз в 15 мин, окно «Ярославль + соседи»)
  //      с автоматическим фолбэком на NASA GIBS (дневной MODIS), если Sat24 недоступен. ----
  var SAT24_BASE='https://imn-rust-lb.infoplaza.io/v4/nowcast/tiles/';
  var SAT24_PRODUCT='satellite-world';
  var SAT24_ZOOM=4;
  // Окно покрытия (долгота/широта, град.) на zoom 3 — широкая территория
  // европейской части России: Санкт-Петербург, Москва, Ярославль, Нижний
  // Новгород, Казань, Екатеринбург и др.
  var SAT24_WEST=28,SAT24_EAST=56,SAT24_SOUTH=48,SAT24_NORTH=64;
  // ---- NASA GIBS (фолбэк) ----
  var GIBS_BASE='https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/';
  var GIBS_PRODUCT='MODIS_Terra_CorrectedReflectance_TrueColor';
  var gibsDate=null;
  function probeDay(url,cb){
    var img=new Image();img.crossOrigin='anonymous';
    img.onload=function(){cb(true);};
    img.onerror=function(){cb(false);};
    img.src=url;
  }
  function pickGIBSDate(cb){
    if(gibsDate){cb(gibsDate);return;}
    var i=0;
    (function next(){
      if(i>=5){gibsDate=new Date().toISOString().slice(0,10);cb(gibsDate);return;}
      var dd=new Date();dd.setUTCDate(dd.getUTCDate()-i);
      var ds=dd.toISOString().slice(0,10);
      var url=GIBS_BASE+GIBS_PRODUCT+'/default/'+ds+'/GoogleMapsCompatible_Level9/9/0/0.jpg';
      probeDay(url,function(ok){
        if(ok){gibsDate=ds;cb(ds);}
        else{i++;next();}
      });
    })();
  }
  // ---- Web Mercator: координаты тайл-индекса и обратно ----
  function wmTileXY(lat,lng,z){
    var n=Math.pow(2,z);
    var x=(lng+180)/360*n;
    var latr=lat*Math.PI/180;
    var y=(0.5-Math.log(Math.tan(latr)+1/Math.cos(latr))/(2*Math.PI))*n;
    return {x:Math.floor(x),y:Math.floor(y)};
  }
  function wmTileBounds(box,z){
    var n=Math.pow(2,z);
    var west=box.x1/n*360-180;
    var east=(box.x2+1)/n*360-180;
    var north=Math.atan(Math.sinh(Math.PI*(1-2*box.y1/n)))*180/Math.PI;
    var south=Math.atan(Math.sinh(Math.PI*(1-2*(box.y2+1)/n)))*180/Math.PI;
    return [[south,west],[north,east]];
  }
  var sat24Box=(function(){
    var nw=wmTileXY(SAT24_NORTH,SAT24_WEST,SAT24_ZOOM);
    var se=wmTileXY(SAT24_SOUTH,SAT24_EAST,SAT24_ZOOM);
    return {x1:nw.x,y1:nw.y,x2:se.x,y2:se.y};
  })();
  function sat24URL(ts){
    return SAT24_BASE+SAT24_PRODUCT+'/'+ts+'/'+SAT24_ZOOM+'/'+sat24Box.y1+'/'+sat24Box.x1+'/'+sat24Box.y2+'/'+sat24Box.x2+'?outputtype=jpeg';
  }
  function pad2(n){return (n<10?'0':'')+n;}
  // ---- авто-подбор свежего timestamp (шаг 15 мин, назад до 2 ч) ----
  function probeSat24(ts,cb){
    var img=new Image();
    img.onload=function(){cb(true);};
    img.onerror=function(){cb(false);};
    img.src=sat24URL(ts);
  }
  function pickSat24Time(cb){
    var now=new Date();
    var base=now.getTime()-30*60000; // учёт задержки появления кадров (~30-45 мин)
    var back=0;
    (function attempt(){
      if(back>120){cb(null);return;}
      var d=new Date(base-back*60000);
      var ts=''+d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate())+pad2(d.getUTCHours())+pad2(Math.floor(d.getUTCMinutes()/15)*15);
      probeSat24(ts,function(ok){
        if(ok){cb(ts);}else{back+=15;attempt();}
      });
    })();
  }
  function sat24Label(ts){
    // ts = YYYYMMDDHHMM (UTC); MSK = UTC+3
    var y=+ts.slice(0,4),mo=+ts.slice(4,6),da=+ts.slice(6,8),hh=+ts.slice(8,10),mm=+ts.slice(10,12);
    var utc=new Date(Date.UTC(y,mo-1,da,hh,mm));
    var msk=new Date(utc.getTime()+3*3600*1000);
    return pad2(msk.getUTCDate())+'.'+pad2(msk.getUTCMonth()+1)+' '+pad2(msk.getUTCHours())+':'+pad2(msk.getUTCMinutes());
  }
  function mskLabel(d){
    var p=d.split('-');
    return p[2]+'.'+p[1]+' MSK · den (Terra)';
  }
  var cloudLayer=null;
  var gibsLayer=null;
  var sat24Layer=null;
  var satAltUsed=false; // true, если ушли в фолбэк GIBS (перемотка Sat24 недоступна)
  var elSatTimeline=document.getElementById('sattimeline');
  var elSatPlay=document.getElementById('satplay');
  var elSatSegs=document.getElementById('satsegs');
  var elSatTime=document.getElementById('sattime');
  var satFrames=[],satIdx=0,satPlaying=false,satTimer=null;
  var SAT24_MINUTES_BACK=360; // ~6 часов истории (шаг 15 мин)
  function sat24Fallback(){
    satAltUsed=true;
    hideSatTimeline();
    pickGIBSDate(function(ds){
      if(!ds)return;
      gibsDate=ds;
      elSatTime.textContent=mskLabel(ds);
      sat24Layer=L.tileLayer(GIBS_BASE+GIBS_PRODUCT+'/default/'+ds+'/GoogleMapsCompatible_Level9/9/{y}/{x}.jpg',{
        minZoom:3,maxZoom:10,minNativeZoom:9,maxNativeZoom:9,zIndex:900,opacity:0.9,
        attribution:'Спутник: <a href="https://earthdata.nasa.gov/">NASA GIBS</a>'
      });
      map.addLayer(sat24Layer);
      cloudLayer=sat24Layer;
    });
  }
  function showSatFrame(i){
    if(!satFrames.length)return;
    i=Math.max(0,Math.min(satFrames.length-1,i));
    satIdx=i;
    var t=satFrames[i];
    var url=sat24URL(t)+'&t='+Date.now();
    if(sat24Layer){
      try{sat24Layer.setUrl(url);}catch(e){}
    }else{
      sat24Layer=L.imageOverlay(url,wmTileBounds(sat24Box,SAT24_ZOOM),{
        zIndex:900,opacity:0.9,
        attribution:'Спутник (15 мин): <a href="https://www.sat24.com/">Sat24</a>'
      });
      map.addLayer(sat24Layer);
    }
    cloudLayer=sat24Layer;
    updateSatSegs();
  }
  function renderSatSegs(){
    elSatSegs.innerHTML='';
    satFrames.forEach(function(t,i){
      var d=document.createElement('div');
      d.title=sat24Label(t);
      d.addEventListener('click',function(){showSatFrame(i);});
      elSatSegs.appendChild(d);
    });
    updateSatSegs();
  }
  function updateSatSegs(){
    for(var j=0;j<elSatSegs.children.length;j++)elSatSegs.children[j].classList.toggle('on',j===satIdx);
    elSatTime.textContent=satIdx<satFrames.length?sat24Label(satFrames[satIdx]):'—';
  }
  function showSatTimeline(){elSatTimeline.classList.remove('hidden');}
  function hideSatTimeline(){elSatTimeline.classList.add('hidden');}
  function buildSatHistory(cb){
    var now=new Date();
    var base=now.getTime()-30*60000;
    var seen={},list=[];
    for(var m=0;m<=SAT24_MINUTES_BACK;m+=15){
      var d=new Date(base-m*60000);
      var ts=''+d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate())+pad2(d.getUTCHours())+pad2(Math.floor(d.getUTCMinutes()/15)*15);
      if(!seen[ts]){seen[ts]=1;list.push(ts);}
    }
    list.sort();
    var valid=[],pending=0,i=0;
    function probe(t){
      pending++;
      var img=new Image();
      img.onload=function(){valid.push(t);pending--;};
      img.onerror=function(){pending--;};
      img.src=sat24URL(t);
    }
    function pump(){
      while(i<list.length&&pending<4){probe(list[i]);i++;}
      if(i===list.length&&pending===0){cb(valid.sort());return true;}
      return false;
    }
    var iv=setInterval(function(){if(pump())clearInterval(iv);},200);
  }
  function toggleSatPlay(){
    if(!satFrames.length)return;
    satPlaying=!satPlaying;
    elSatPlay.textContent=satPlaying?'⏸':'▶';
    if(satPlaying){
      if(satIdx>=satFrames.length-1)showSatFrame(0);
      satTimer=setInterval(function(){
        if(satIdx+1<satFrames.length){showSatFrame(satIdx+1);}
        else{satPlaying=false;elSatPlay.textContent='▶';clearInterval(satTimer);satTimer=null;}
      },700);
    }else{clearInterval(satTimer);satTimer=null;}
  }
  elSatPlay.addEventListener('click',toggleSatPlay);
  elSatSegs.addEventListener('click',function(e){
    var t=e.target;
    while(t&&t!==elSatSegs&&t.parentNode!==elSatSegs)t=t.parentNode;
    if(t&&t!==elSatSegs&&t.parentNode===elSatSegs){
      if(satPlaying){satPlaying=false;elSatPlay.textContent='▶';clearInterval(satTimer);satTimer=null;}
      showSatFrame(Array.prototype.indexOf.call(elSatSegs.children,t));
    }
  });
  function loadCloud(){
    // быстро показываем свежий кадр (приоритет пользователя)
    pickSat24Time(function(ts){
      if(ts&&!satAltUsed){
        if(satFrames.length===0){satFrames=[ts];satIdx=0;showSatFrame(0);}
      }else if(!ts&&!satAltUsed){sat24Fallback();}
    });
    // параллельно строим историю перемотки (~6 ч)
    buildSatHistory(function(list){
      if(!list.length){if(!satAltUsed)sat24Fallback();return;}
      if(satAltUsed)return;
      satFrames=list;
      satIdx=satFrames.length-1;
      showSatTimeline();
      renderSatSegs();
      showSatFrame(satFrames.length-1);
    });
  }
  // Спутниковая облачность всегда включена (без кнопки-переключателя)
  loadCloud();

  map.createPane('lightning-0');
  map.createPane('lightning-1');
  var ltBase='https://images.lightningmaps.org/blitzortung/europe/index.php?tile&zoom={z}&x={x}&y={y}&type=';
  var lt0=L.tileLayer(ltBase+'0&_t='+Date.now(),{opacity:0.9,maxZoom:19,pane:'lightning-0',attribution:'Молнии: <a href="https://www.blitzortung.org">Blitzortung.org</a>'});
  var lt1=L.tileLayer(ltBase+'1&_t='+Date.now(),{opacity:0.9,maxZoom:19,pane:'lightning-1'});
  var lightningGroup=L.layerGroup([lt0,lt1]).addTo(map);
  var elLt=document.getElementById('ltoggle');
  var ltOn=true;
  elLt.classList.add('on');
  elLt.addEventListener('click',function(){
    ltOn=!ltOn;
    if(ltOn){lightningGroup.addTo(map);elLt.classList.add('on');}
    else{map.removeLayer(lightningGroup);elLt.classList.remove('on');}
  });
  setInterval(function(){
    lt0.setUrl(ltBase+'0&_t='+Date.now());
    lt1.setUrl(ltBase+'1&_t='+Date.now());
  },120000);

  map.createPane('labels');
  var LabelsLayer=L.GridLayer.extend({
    options:{pane:'labels',minZoom:5,maxZoom:10,updateWhenZooming:false},
    createTile:function(coords){
      var tile=document.createElement('div');
      tile.style.width='256px';
      tile.style.height='256px';
      var url='https://rainradar.ru/labels?z='+coords.z+'&x='+coords.x+'&y='+coords.y;
      fetch(url).then(function(r){return r.json();}).then(function(labels){
        for(var i=0;i<labels.length;i++){
          var d=document.createElement('div'),s=document.createElement('span');
          d.className='label l'+labels[i][4];
          s.textContent=labels[i][1];
          d.style.left=labels[i][2]+'px';
          d.style.bottom=labels[i][3]+'px';
          d.appendChild(s);
          tile.appendChild(d);
        }
      }).catch(function(){});
      return tile;
    }
  });
  map.addLayer(new LabelsLayer());


})();
</script>
</body>
</html>
