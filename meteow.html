<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeteoMap — почасовой + 16 дней</title>
<style>
:root{
  --bg:#1b2028; --card:#232a35; --line:#2f3744;
  --text:#e8ecf3; --muted:#8b94a7;
  --rain:#4fc3f7; --rain-bg:rgba(79,195,247,.08);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6fa; --card:#ffffff; --line:#dde2ed;
    --text:#1f2637; --muted:#5c6579;
    --rain:#0288d1; --rain-bg:rgba(2,136,209,.07);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding:10px;overflow-x:auto;overflow-y:hidden;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  max-width:560px;margin:0 auto;padding:10px 12px;
}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.city{font-size:15px;font-weight:600}
.updated{font-size:11px;color:var(--muted)}
.strip{display:flex;gap:2px;padding:2px 0 4px}
.hour{
  flex:1 1 0;min-width:0;
  text-align:center;font-size:12px;
  padding:6px 1px;border-radius:10px;
  overflow:hidden;
}
@media (max-width:420px){
  .hour .ht{font-size:9px}
  .hour .he{font-size:17px}
  .hour .htemp{font-size:11.5px}
  .hour .hpp,.hour .hmm{font-size:10.5px}
}
.hour.rain{background:var(--rain-bg)}
.hour .ht{color:var(--muted);font-size:10.5px;white-space:nowrap}
.hour .he{font-size:21px;line-height:1.35}
.hour .htemp{font-weight:600;font-size:13.5px}
.hour .hpp{color:var(--rain);font-size:12px;min-height:13px;white-space:nowrap}
.hour .hmm{color:var(--rain);font-size:11.5px;min-height:13px;white-space:nowrap}
.d10wrap{overflow-x:auto;padding:2px 0}
.d10strip{display:flex;width:100%;min-width:100%}
.d10col{flex:1 1 0;min-width:0;text-align:center;position:relative}
.d10tube{height:50px;position:relative}
.d10prec{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#4fc3f7,#0288d1);opacity:.75}
.d10cloud{position:absolute;left:0;right:0;top:0;background:linear-gradient(#eceff1,#b0bec5);opacity:.75}
.d10tbar{position:absolute;left:50%;transform:translateX(-50%);width:6px;background:linear-gradient(#e74c3c,#f39c12,#3498db);border-radius:3px}
.d10tday,.d10tnight{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;line-height:1}
.d10tday{color:#c0392b}
.d10tnight{color:#2c6f9b}
.d10mm{font-size:10px;color:#666;white-space:nowrap;padding:2px 0}
.d10wind{display:none}
.d10cond{display:none}
.d10day{font-size:10px;color:#666;border-top:1px dashed var(--line);padding-top:3px;margin-top:1px;white-space:nowrap}
.d10day b{color:#222}
.err{color:var(--muted);font-size:12px;padding:8px 2px}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="city" id="city">MeteoMap</span>
    <span class="updated" id="updated"></span>
  </div>
  <div class="strip" id="strip"></div>
  <div class="d10wrap"><div class="d10strip" id="d10strip"></div></div>
</div>
<script>
(function(){
'use strict';

var CITIES = {
  yaroslavl: 'Ярославль',
  tsedenevo: 'Цеденево',
  rybinsk: 'Рыбинск',
  rostov: 'Ростов Великий',
  petropavlovka: 'Петропавловка',
  moscow: 'Москва',
  loo: 'Лоо',
  borok: 'Борок',
  balakirevo: 'Балакирево'
};

var WMO = {
  0:{e:'\u2600\uFE0F',l:'Ясно'}, 1:{e:'\uD83C\uDF24',l:'Преим. ясно'}, 2:{e:'\u26C5',l:'Переменная облачность'},
  3:{e:'\u2601\uFE0F',l:'Пасмурно'}, 45:{e:'\uD83C\uDF2B',l:'Туман'}, 48:{e:'\uD83C\uDF2B',l:'Туман'},
  51:{e:'\uD83C\uDF27',l:'Морось'}, 53:{e:'\uD83C\uDF27',l:'Морось'}, 55:{e:'\uD83C\uDF27',l:'Морось'},
  56:{e:'\uD83C\uDF27',l:'Ледяная морось'}, 57:{e:'\uD83C\uDF27',l:'Ледяная морось'},
  61:{e:'\uD83C\uDF27',l:'Небольшой дождь'}, 63:{e:'\uD83C\uDF27',l:'Дождь'}, 65:{e:'\uD83C\uDF27',l:'Сильный дождь'},
  66:{e:'\uD83C\uDF27',l:'Ледяной дождь'}, 67:{e:'\uD83C\uDF27',l:'Ледяной дождь'},
  71:{e:'\uD83C\uDF28',l:'Снег'}, 73:{e:'\uD83C\uDF28',l:'Снег'}, 75:{e:'\u2744\uFE0F',l:'Сильный снег'},
  77:{e:'\u2744\uFE0F',l:'Снежная крупа'},
  80:{e:'\uD83C\uDF27',l:'Ливень'}, 81:{e:'\uD83C\uDF27',l:'Ливень'}, 82:{e:'\u26C8',l:'Сильный ливень'},
  85:{e:'\uD83C\uDF28',l:'Снегопад'}, 86:{e:'\uD83C\uDF28',l:'Снегопад'},
  95:{e:'\u26C8',l:'Гроза'}, 96:{e:'\u26C8',l:'Гроза с градом'}, 99:{e:'\u26C8',l:'Гроза с градом'}
};

var DOW = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

var DEFAULT_CITY = 'tsedenevo';
var DEFAULT_HOURS = 14;
var REFRESH_MS = 15 * 60 * 1000;

function getParam(name, def){
  var m = new RegExp('[?&]' + name + '=([^&]+)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : def;
}

var city = getParam('city', DEFAULT_CITY);
if (!CITIES[city]) city = DEFAULT_CITY;
var hours = parseInt(getParam('hours', DEFAULT_HOURS), 10);
if (!(hours >= 1 && hours <= 24)) hours = DEFAULT_HOURS;

var strip = document.getElementById('strip');
var d10strip = document.getElementById('d10strip');
var cityEl = document.getElementById('city');
var updEl = document.getElementById('updated');

cityEl.textContent = '\uD83C\uDF24';

function relUrl(){ return 'data/' + city + '.json'; }
function absUrl(){ return 'https://samlab.github.io/MeteoMap/data/' + city + '.json'; }

function load(){
  fetch(relUrl(), {cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(render)
    .catch(function(){
      return fetch(absUrl(), {cache:'no-cache'})
        .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(render)
        .catch(showError);
    });
}

function buildSummary(times, data, rawData, idx){
  var RAIN=[51,53,55,56,57,61,63,65,66,67,80,81,82];
  var now=new Date();
  var todayStr=now.toDateString();
  function hasRainAt(j){var code=data.weather_code?Math.round(data.weather_code[j]):0;return RAIN.indexOf(code)>=0;}
  function modelRainCount(j){
    var n=0;for(var c in rawData){var m=rawData[c];if(!m)continue;var code=m.weather_code?Math.round(m.weather_code[j]):0;var pr=m.precipitation?m.precipitation[j]:null;if(RAIN.indexOf(code)>=0||(pr!=null&&pr>=0.1))n++;}return n;
  }
  var rainHour=-1,jLast=-1;
  for(var j=idx;j<times.length;j++){
    if(times[j].toDateString()!==todayStr) break;
    if(hasRainAt(j)){if(rainHour<0)rainHour=j;jLast=j;}
  }
  var fromModels=false;
  if(rainHour<0){
    for(var j=idx;j<times.length;j++){
      if(times[j].toDateString()!==todayStr) break;
      if(modelRainCount(j)>=2){if(rainHour<0)rainHour=j;jLast=j;}
    }
    if(rainHour>=0)fromModels=true;
  }
  if(rainHour<0) return '\u041E\u0441\u0442\u0430\u0442\u043E\u043A \u0434\u043D\u044F \u0431\u0435\u0437 \u0434\u043E\u0436\u0434\u044F';
  var sumPr=0,maxPp=0,modelCnt=0;
  for(var j=rainHour;j<=jLast;j++){
    var p=data.precipitation?data.precipitation[j]:0;
    if(p!=null)sumPr+=p;
    var pp=data.precipitation_probability?data.precipitation_probability[j]:0;
    if(pp!=null&&pp>maxPp)maxPp=pp;
  }
  var peakModels=0;
  var seenModels={};
  for(var j=rainHour;j<=jLast;j++){
    for(var c in rawData){var m=rawData[c];if(!m)continue;var code=m.weather_code?Math.round(m.weather_code[j]):0;var pr=m.precipitation?m.precipitation[j]:null;if((RAIN.indexOf(code)>=0||(pr!=null&&pr>=0.1))&&!seenModels[c])seenModels[c]=1;}
  }
  peakModels=Object.keys(seenModels).length;
  var jPeak=rainHour,peakPr=-1;
  for(var j=rainHour;j<=jLast;j++){
    var p=data.precipitation?data.precipitation[j]:0;
    if(p!=null&&p>peakPr){peakPr=p;jPeak=j;}
  }
  var rainType=(WMO[data.weather_code?Math.round(data.weather_code[jPeak]):0]||{}).l||'\u0414\u043E\u0436\u0434\u044C';
  var st=pad2(times[rainHour].getHours())+'ч';
  var en=pad2(times[jLast].getHours())+'ч';
  var timeStr=(rainHour===idx)?('до '+en):(st===en?'\u0432 '+st:'\u0441 '+st+' \u0434\u043E '+en);
  var cntStr=' ('+peakModels+'\u043C)';
  if(fromModels) return '\u0412\u0435\u0440\u043E\u044F\u0442\u043D\u044B \u041E\u0441\u0430\u0434\u043A\u0438 '+timeStr+' \u043D\u0430 '+fmtP(sumPr)+'\u043C\u043C \u0441 '+Math.round(maxPp)+'%'+cntStr;
  return rainType+' '+timeStr+' \u043D\u0430 '+fmtP(sumPr)+'\u043C\u043C \u0441 '+Math.round(maxPp)+'%'+cntStr;
}

function fmtP(v){
  if(v==null) return '\u2014';
  return Math.round(v*10)/10;
}

function temp(v){ return v==null ? '\u2014' : (v>0?'+':'') + Math.round(v) + '\u00B0'; }
function num(v){ return v==null ? '\u2014' : Math.round(v); }

function render(data){
  if (!data || !data.time || !data.weighted) return showError('\u041D\u0435\u0442 \u0434\u0430\u043D\u043D\u044B\u0445');

  var times = data.time.map(function(t){ return new Date(t); });
  var now = new Date();

  var idx = -1;
  for (var i = 0; i < times.length; i++){
    if (times[i] <= now) idx = i;
    else break;
  }
  if (idx < 0) idx = 0;

  var summary = buildSummary(times, data.weighted, data.models, idx);
  cityEl.textContent = '\uD83C\uDF24 ' + summary;

  var html = '';
  for (var h = 0; h < hours && idx + h < times.length; h++){
    var i = idx + h;
    var t = times[i];
    var code = data.weighted.weather_code ? Math.round(data.weighted.weather_code[i]) : 0;
    var w = WMO[code] || {e:'\uD83C\uDF21', l:'\u041A\u043E\u0434 ' + code};
    var temperature = Math.round(data.weighted.temperature_2m[i]);
    var prob = data.weighted.precipitation_probability ? Math.round(data.weighted.precipitation_probability[i]) : 0;
    var mm = data.weighted.precipitation ? data.weighted.precipitation[i] : 0;
    var rain = prob >= 50 || mm >= 0.1;
    var tempStr = (temperature > 0 ? '+' : '') + temperature + '\u00B0';

    var drop = (mm >= 0.05) ? '\uD83D\uDCA7' : '';
    var probStr = prob > 0 ? (drop + prob + '%') : '';
    var mmStr = fmtMm(mm);

    html += '<div class="hour' + (rain ? ' rain' : '') + '" title="' + w.l + '">' +
      '<div class="ht">' + pad2(t.getHours()) + 'ч</div>' +
      '<div class="he">' + w.e + '</div>' +
      '<div class="htemp">' + tempStr + '</div>' +
      '<div class="hpp">' + probStr + '</div>' +
      '<div class="hmm">' + mmStr + '</div>' +
      '</div>';
  }
  strip.innerHTML = html;

  if (!data.daily_time || !data.daily){ d10strip.innerHTML = ''; return; }

  var days = data.daily_time;
  var daily = data.daily;
  var todayStr = now.toISOString().slice(0,10);
  var arr = [];
  for (var di = 0; di < days.length; di++){
    var dateStr = days[di];
    if (dateStr <= todayStr) continue;
    var d = new Date(dateStr + 'T12:00:00');
    var idx15 = -1;
    for (var j = 0; j < times.length; j++){
      if (times[j].toDateString() === d.toDateString() && times[j].getHours() === 15){ idx15 = j; break; }
    }
    var code2 = (idx15 >= 0 && data.weighted.weather_code) ? Math.round(data.weighted.weather_code[idx15]) : 0;
    var w2 = WMO[code2] || {e:'\uD83C\uDF21', l:'\u041A\u043E\u0434 ' + code2};
    var tmin = daily.temperature_2m_min ? daily.temperature_2m_min[di] : null;
    var tmax = daily.temperature_2m_max ? daily.temperature_2m_max[di] : null;
    var pr = daily.precipitation_sum ? daily.precipitation_sum[di] : null;
    var pp = daily.precipitation_probability_max ? daily.precipitation_probability_max[di] : null;
    var cl = daily.cloud_cover_mean ? daily.cloud_cover_mean[di] : null;
    var ws = daily.wind_speed_10m_max ? daily.wind_speed_10m_max[di] : null;
    arr.push({tmin:tmin,tmax:tmax,pr:pr,pp:pp,cl:cl,ws:ws,we:w2.e,d:d});
  }

  var lo = Infinity, hi = -Infinity;
  for (var i = 0; i < arr.length; i++){
    if (arr[i].tmin != null && arr[i].tmin < lo) lo = arr[i].tmin;
    if (arr[i].tmax != null && arr[i].tmax > hi) hi = arr[i].tmax;
  }
  if (!isFinite(lo) || !isFinite(hi) || hi <= lo){ lo = 0; hi = 30; }
  var span = hi - lo;
  var TOP = 12, BTM = 50 - 8;
  var SCALE = span > 0 ? (BTM - TOP) / span : 0;
  function yT(t){ return t == null ? BTM : (span > 0 ? BTM - SCALE * (t - lo) : (TOP + BTM) / 2); }

  var html10 = '';
  for (var di = 0; di < Math.min(arr.length, 14); di++){
    var x = arr[di];
    var y1 = yT(x.tmax), y2 = yT(x.tmin);
    var h = (y1==null||y2==null) ? 0 : Math.max(2, y2 - y1);
    var pR = x.pr != null ? Math.max(0, Math.round(x.pr / 50 * 100)) : 0;
    var pC = Math.max(0, Math.min(100, Math.round(x.cl || 0)));
    html10 += '<div class="d10col"><div class="d10tube">' +
      '<div class="d10cloud" style="height:' + pC + '%"></div>' +
      '<div class="d10prec" style="height:' + pR + '%"></div>' +
      '<div class="d10tbar" style="top:' + y1 + 'px;height:' + h + 'px"></div>' +
      '<div class="d10tday" style="top:' + (y1-15) + 'px">' + temp(x.tmax) + '</div>' +
      '<div class="d10tnight" style="top:' + (y2+2) + 'px">' + temp(x.tmin) + '</div>' +
      '</div>' +
      '<div class="d10mm">' + (x.pr==null?'\u2014':Math.round(x.pr*10)/10) + ' \u043C\u043C</div>' +
      '<div class="d10cond"><span class="ic">' + x.we + '</span></div>' +
      '<div class="d10wind">' + (x.ws==null?'\u2014':num(x.ws) + ' \u043C/\u0441') + '</div>' +
      '<div class="d10day"><b>' + DOW[x.d.getDay()] + '</b> ' + x.d.getDate() + '</div>' +
      '</div>';
  }
  d10strip.innerHTML = html10;

  var gen = data.generated_at ? new Date(data.generated_at) : null;
  updEl.textContent = gen ? pad2(gen.getHours()) + ':' + pad2(gen.getMinutes()) : '\u2014';
}

function showError(msg){
  strip.innerHTML = '<div class="err">\u26A0\uFE0F \u041D\u0435 \u0443\u0434\u0430\u043B\u043E\u0441\u044C \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044C \u0434\u0430\u043D\u043D\u044B\u0435' + (msg ? ' (' + msg + ')' : '') + '</div>';
  d10strip.innerHTML = '';
  updEl.textContent = '';
  cityEl.textContent = '\uD83C\uDF24';
}

function pad2(n){ return (n < 10 ? '0' : '') + n; }

function fmtMm(v){
  if (v == null || v < 0.05) return '0 \u043C\u043C';
  var x = Math.round(v * 10) / 10;
  return (x >= 10 ? Math.round(x) : x.toFixed(1).replace('.', ',')) + ' \u043C\u043C';
}

load();
setInterval(load, REFRESH_MS);
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) load();
});
})();
</script>
</body>
</html>
