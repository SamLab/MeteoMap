<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeteoMap — почасовой + 16 дней</title>
<style>
:root{
  --bg:#1b2028; --card:#232a35; --line:#2f3744;
  --text:#e8ecf3; --muted:#8b94a7;
  --rain:#4fc3f7; --rain-bg:rgba(79,195,247,.08);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6fa; --card:#ffffff; --line:#dde2ed;
    --text:#1f2637; --muted:#5c6579;
    --rain:#0288d1; --rain-bg:rgba(2,136,209,.07);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding:0;overflow-x:auto;overflow-y:auto;
}
.card{
  /* Без рамки и скругления: виджет встраивается в чужую страницу и должен
     начинаться почти в левом верхнем углу окна. Воздух дают 2px сверху и по бокам. */
  background:var(--card);
  max-width:600px;margin:0;padding:2px 2px 0 2px;
}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.city{font-size:13.5px;font-weight:600}.city .cico{font-size:18px;line-height:1;vertical-align:-1px}
.updated{font-size:11px;color:var(--muted)}
.strip{display:flex;gap:2px;padding:2px 0 1px;position:relative}
.hour{
  flex:1 1 0;min-width:0;
  text-align:center;font-size:12px;
  padding:6px 1px;border-radius:10px;
  overflow:hidden;
  position:relative;z-index:1;
}
@media (max-width:420px){
  .hour .ht{font-size:8.5px}
  .hour .he{font-size:16.5px}
  .hour .htemp{font-size:11px}
  .hour .hpp{font-size:7.5px}
  .hour .hmm{font-size:7px}
}
.hour.rain{background:var(--rain-bg)}
.hour .ht{color:var(--muted);font-size:10px;white-space:nowrap}
.hour .he{font-size:20.5px;line-height:1.35}.hour .hwnd{font-size:9px;line-height:1.1;min-height:12px;color:var(--muted);white-space:nowrap}.hour .hwnd .warr{font-size:10px}
.hour .htemp{font-weight:600;font-size:13px}
.hour .hpp{color:var(--rain);font-size:9.5px;min-height:13px;white-space:nowrap}
.ppct{font-size:.5em}
.hour .hmm{color:var(--rain);font-size:9px;min-height:13px;white-space:nowrap}
.d10wrap{overflow-x:auto;padding:0px 0 2px}
.d10strip{display:flex;width:100%;min-width:100%;position:relative}
.d10col{flex:1 1 0;min-width:0;text-align:center;position:relative;z-index:1;border-left:1px solid var(--line)}
.d10col:first-child{border-left:0}
.d10tube{height:74px;position:relative;z-index:1}
.d10svg{position:absolute;left:0;top:0;width:100%;height:74px;overflow:hidden;pointer-events:none}
.d10ccf{fill:rgba(141,154,165,.35);stroke:none}
.d10prf{fill:rgba(25,118,210,.45);stroke:none}
.d10cline{fill:none;stroke-width:0.25;stroke-linejoin:round;stroke-linecap:round}
.hobg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.d10tday,.d10tnight{position:absolute;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;white-space:nowrap;line-height:1}
.d10tday{color:#c0392b}
.d10tnight{color:#2c6f9b}
.d10cond{font-size:15.5px;line-height:1;min-height:18px;padding:2px 0;white-space:nowrap}
.d10cond .ic{font-size:15.5px}
.d10wind{font-size:9.5px;color:var(--muted);white-space:nowrap;padding-top:2px}
.warr{display:inline-block;font-size:11px;line-height:1;transform-origin:center;vertical-align:-1px}
.d10day{font-size:9.5px;color:#666;border-top:1px dashed var(--line);padding-top:3px;margin-top:1px;white-space:nowrap}
.d10day b{color:#222}
.err{color:var(--muted);font-size:12px;padding:8px 2px}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="city" id="city">MeteoMap</span>
    <span class="updated" id="updated"></span>
  </div>
  <div class="strip" id="strip"></div>
  <div class="d10wrap"><div class="d10strip" id="d10strip"></div></div>
</div>
<script>
(function(){
'use strict';

var CITIES = {
  yaroslavl: 'Ярославль',
  tsedenevo: 'Цеденево',
  rybinsk: 'Рыбинск',
  rostov: 'Ростов Великий',
  petropavlovka: 'Петропавловка',
  moscow: 'Москва',
  loo: 'Лоо',
  borok: 'Борок',
  batumi: 'Батуми (Грузия)'
};

var WMO = {
  0:{e:'\u2600\uFE0F',l:'Ясно'}, 1:{e:'\uD83C\uDF24',l:'В основном ясно'}, 2:{e:'\u26C5',l:'Переменная облачность'},
  3:{e:'\u2601\uFE0F',l:'Пасмурно'}, 45:{e:'\uD83C\uDF2B',l:'Туман'}, 48:{e:'\uD83C\uDF2B',l:'Изморозь'},
  51:{e:'\uD83C\uDF27',l:'Небольшая морось'}, 53:{e:'\uD83C\uDF27',l:'Морось'}, 55:{e:'\uD83C\uDF27',l:'Сильная морось'},
  56:{e:'\uD83C\uDF27',l:'Ледяная морось'}, 57:{e:'\uD83C\uDF27',l:'Ледяная морось'},
  61:{e:'\uD83C\uDF27',l:'Небольшой дождь'}, 63:{e:'\uD83C\uDF27',l:'Дождь'}, 65:{e:'\uD83C\uDF27',l:'Сильный дождь'},
  66:{e:'\uD83C\uDF27',l:'Ледяной дождь'}, 67:{e:'\uD83C\uDF27',l:'Ледяной дождь'},
  71:{e:'\uD83C\uDF28',l:'Небольшой снег'}, 73:{e:'\uD83C\uDF28',l:'Снег'}, 75:{e:'\u2744\uFE0F',l:'Сильный снег'},
  77:{e:'\u2744\uFE0F',l:'Снежные зерна'},
  80:{e:'\uD83C\uDF27',l:'Небольшой ливень'}, 81:{e:'\uD83C\uDF27',l:'Ливень'}, 82:{e:'\u26C8',l:'Сильный ливень'},
  85:{e:'\uD83C\uDF28',l:'Снегопад'}, 86:{e:'\uD83C\uDF28',l:'Снегопад'},
  95:{e:'\u26C8',l:'Гроза'}, 96:{e:'\u26C8',l:'Гроза с градом'}, 99:{e:'\u26C8',l:'Гроза с градом'}
};

var DOW = ['\u0412\u0441','\u041F\u043D','\u0412\u0442','\u0421\u0440','\u0427\u0442','\u041F\u0442','\u0421\u0431'];

var DEFAULT_CITY = 'tsedenevo';
var DEFAULT_HOURS = 16;
var REFRESH_MS = 5 * 60 * 1000;

function getParam(name, def){
  var m = new RegExp('[?&]' + name + '=([^&]+)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : def;
}

var city = getParam('city', DEFAULT_CITY);
if (!CITIES[city]) city = DEFAULT_CITY;
var hours = parseInt(getParam('hours', DEFAULT_HOURS), 10);
if (!(hours >= 1 && hours <= 24)) hours = DEFAULT_HOURS;

var strip = document.getElementById('strip');
var d10strip = document.getElementById('d10strip');
var cityEl = document.getElementById('city');
var updEl = document.getElementById('updated');

cityEl.innerHTML = '<span class="cico">\uD83C\uDF24</span>';

function relUrl(){ return 'data/' + city + '.json'; }
function absUrl(){ return 'https://samlab.github.io/MeteoMap/data/' + city + '.json'; }
function dataUrl(base){
  return (window.__DATA_VERSION__ ? base + '?v=' + encodeURIComponent(window.__DATA_VERSION__) : base);
}

function load(){
  function withToken(){
    fetch(dataUrl(relUrl()), {cache:'no-cache'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(render)
      .catch(function(){
        return fetch(dataUrl(absUrl()), {cache:'no-cache'})
          .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
          .then(render)
          .catch(showError);
      });
  }
  if (window.__DATA_VERSION__) { withToken(); return; }
  fetch('data/version.json', {cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){ window.__DATA_VERSION__ = d && d.v ? d.v : ''; withToken(); })
    .catch(withToken);
}

function rcCnt(mn,mx){if(mn<1)return '';return mn===mx?mn+'\u043C':mn+'-'+mx+'\u043C';}
function relDay(d){
  var nd=new Date();nd.setHours(0,0,0,0);
  var t=new Date(d);t.setHours(0,0,0,0);
  var diff=Math.round((t-nd)/86400000);
  if(diff===0)return '\u0421\u0435\u0433\u043E\u0434\u043D\u044F';
  if(diff===1)return '\u0417\u0430\u0432\u0442\u0440\u0430';
  return DOW[t.getDay()]+' '+t.getDate();
}
function buildSummary(times, data, rawData, idx){
  var RAIN=[51,53,55,56,57,61,63,65,66,67,80,81,82];
  function hasRainAt(j){var c=data.weather_code?Math.round(data.weather_code[j]):0;var p=data.precipitation?data.precipitation[j]:null;var q=data.precipitation_probability?data.precipitation_probability[j]:null;return RAIN.indexOf(c)>=0||(p!=null&&p>=0.1)||((p==null||p<0.1)&&q!=null&&q>20);}
  function modelRainCount(j){
    var n=0;for(var c in rawData){var m=rawData[c];if(!m)continue;var code=m.weather_code?Math.round(m.weather_code[j]):0;var pr=m.precipitation?m.precipitation[j]:null;var pp=m.precipitation_probability?m.precipitation_probability[j]:null;if(code?RAIN.indexOf(code)>=0:(pr!=null&&pr>=0.1||(pp!=null&&pp>33)))n++;}return n;
  }
  var rainHour=-1,jLast=-1;
  for(var j=idx;j<times.length;j++){
    if(hasRainAt(j)||modelRainCount(j)>=2){if(rainHour<0)rainHour=j;jLast=j;}else if(rainHour>=0)break;
  }
  var fromModels=rainHour>=0&&!hasRainAt(rainHour);
  if(rainHour<0) return '\u041E\u0441\u0442\u0430\u0442\u043E\u043A \u0434\u043D\u044F \u0431\u0435\u0437 \u0434\u043E\u0436\u0434\u044F';
  var sumPr=0,maxPp=0,modelCnt=0;
  for(var j=rainHour;j<=jLast;j++){
    var p=data.precipitation?data.precipitation[j]:0;
    if(p!=null)sumPr+=p;
    var pp=data.precipitation_probability?data.precipitation_probability[j]:0;
    if(pp!=null&&pp>maxPp)maxPp=pp;
  }
  var peakModels=Infinity,peakMax=-Infinity,conPeak=Infinity,conMax=-Infinity;
  for(var j=rainHour;j<=jLast;j++){var n=0,cn=0;
    for(var c in rawData){var m=rawData[c];if(!m)continue;var code=m.weather_code?Math.round(m.weather_code[j]):null;var pr=m.precipitation?m.precipitation[j]:null;var pp=m.precipitation_probability?m.precipitation_probability[j]:null;if(code!=null?RAIN.indexOf(code)>=0:(pr!=null&&pr>=0.1||(pp!=null&&pp>33)))n++;if(RAIN.indexOf(code)>=0||(pr!=null&&pr>=0.1)||((pr==null||pr<0.1)&&pp!=null&&pp>20))cn++;}
    if(n<peakModels)peakModels=n;
    if(n>peakMax)peakMax=n;
    if(cn<conPeak)conPeak=cn;
    if(cn>conMax)conMax=cn;
  }
  if(peakModels===Infinity)peakModels=0;
  if(peakMax===-Infinity)peakMax=0;
  if(conPeak===Infinity)conPeak=0;
  if(conMax===-Infinity)conMax=0;
  var jPeak=rainHour,peakPr=-1;
  for(var j=rainHour;j<=jLast;j++){
    var p=data.precipitation?data.precipitation[j]:0;
    if(p!=null&&p>peakPr){peakPr=p;jPeak=j;}
  }
  var jCode=data.weather_code?Math.round(data.weather_code[rainHour]):0;
  var rainType=(RAIN.indexOf(jCode)>=0&&WMO[jCode])?WMO[jCode].l:'\u0414\u043E\u0436\u0434\u044C';
  var st=times[rainHour].toDateString()===times[idx].toDateString()?pad2(times[rainHour].getHours())+'ч':relDay(times[rainHour])+' '+pad2(times[rainHour].getHours())+'ч';
  var endIdx=Math.min(jLast+1,times.length-1);
  var en=(times[endIdx].getHours()===0)?'\u0030\u0030\u0447':(times[endIdx].toDateString()===times[rainHour].toDateString()?pad2(times[endIdx].getHours())+'ч':relDay(times[endIdx])+' '+pad2(times[endIdx].getHours())+'ч');
  var timeStr=(rainHour===idx)?('до '+en):(st===en?'\u0432 '+st:st+'-'+en);
  var cntStr=peakModels>=1?(' '+rcCnt(peakModels,peakMax)):'';
  var conCnt=conPeak>=1?(' '+rcCnt(conPeak,conMax)):'';
  var stats='['+fmtP(sumPr)+'*'+Math.round(maxPp)+'%]';
  if(fromModels) return '\u0412\u0435\u0440\u043E\u044F\u0442\u043D\u044B \u041E\u0441\u0430\u0434\u043A\u0438 '+timeStr+' '+stats+cntStr;
  return rainType+' '+timeStr+' '+stats+conCnt;
}

// Вторая строка шапки — «Подтверждённые» — тот же расчёт, но интервал только
// по консенсусу (все модели согласны), без учёта одиночных моделей. Текст
// повторяет подтверждённую ветку buildSummary, вместе с её счётчиком conCnt.
function summaryConfirmed(times, data, rawData, idx){
  var RAIN=[51,53,55,56,57,61,63,65,66,67,80,81,82];
  function hasRainAt(j){var c=data.weather_code?Math.round(data.weather_code[j]):0;var p=data.precipitation?data.precipitation[j]:null;var q=data.precipitation_probability?data.precipitation_probability[j]:null;return RAIN.indexOf(c)>=0||(p!=null&&p>=0.1)||((p==null||p<0.1)&&q!=null&&q>20);}
  var rainHour=-1,jLast=-1;
  for(var j=idx;j<times.length;j++){
    if(hasRainAt(j)){if(rainHour<0)rainHour=j;jLast=j;}else if(rainHour>=0)break;
  }
  if(rainHour<0) return '\u041E\u0441\u0442\u0430\u0442\u043E\u043A \u0434\u043D\u044F \u0431\u0435\u0437 \u0434\u043E\u0436\u0434\u044F';
  var sumPr=0,maxPp=0;
  for(var j=rainHour;j<=jLast;j++){
    var p=data.precipitation?data.precipitation[j]:0;
    if(p!=null)sumPr+=p;
    var pp=data.precipitation_probability?data.precipitation_probability[j]:0;
    if(pp!=null&&pp>maxPp)maxPp=pp;
  }
  var conPeak=Infinity,conMax=-Infinity;
  for(var j=rainHour;j<=jLast;j++){var cn=0;
    for(var c in rawData){var m=rawData[c];if(!m)continue;var code=m.weather_code?Math.round(m.weather_code[j]):null;var pr=m.precipitation?m.precipitation[j]:null;var pp=m.precipitation_probability?m.precipitation_probability[j]:null;if(RAIN.indexOf(code)>=0||(pr!=null&&pr>=0.1)||((pr==null||pr<0.1)&&pp!=null&&pp>20))cn++;}
    if(cn<conPeak)conPeak=cn;
    if(cn>conMax)conMax=cn;
  }
  if(conPeak===Infinity)conPeak=0;
  if(conMax===-Infinity)conMax=0;
  var jCode=data.weather_code?Math.round(data.weather_code[rainHour]):0;
  var rainType=(RAIN.indexOf(jCode)>=0&&WMO[jCode])?WMO[jCode].l:'\u0414\u043E\u0436\u0434\u044C';
  var st=times[rainHour].toDateString()===times[idx].toDateString()?pad2(times[rainHour].getHours())+'\u0447':relDay(times[rainHour])+' '+pad2(times[rainHour].getHours())+'\u0447';
  var endIdx=Math.min(jLast+1,times.length-1);
  var en=(times[endIdx].getHours()===0)?'\u0030\u0030\u0447':(times[endIdx].toDateString()===times[rainHour].toDateString()?pad2(times[endIdx].getHours())+'\u0447':relDay(times[endIdx])+' '+pad2(times[endIdx].getHours())+'\u0447');
  var timeStr=(rainHour===idx)?('\u0434\u043E '+en):(st===en?'\u0432 '+st:st+'-'+en);
  var conCnt=conPeak>=1?(' '+rcCnt(conPeak,conMax)):'';
  var stats='['+fmtP(sumPr)+'*'+Math.round(maxPp)+'%]';
  return rainType+' '+timeStr+' '+stats+conCnt;
}

// Сводка в шапке чередуется при каждом обновлении (авто раз в 5 минут,
// возврат на вкладку и перезагрузка страницы): «Ближайшие осадки»
// (buildSummary, интервал по любым моделям) и «Подтверждённые»
// (summaryConfirmed, интервал по консенсусу). Последний показанный режим
// хранится в localStorage, поэтому после перезагрузки страница показывает
// противоположную строку, а первый в жизни показ — «ближайшие».
var headMode='nearest';
var HEAD_MODE_KEY='meteow.headMode';
var hTimes=null,hData=null,hWdg=null,hRaw=null,hIdx=-1;
function readHeadMode(){
  try{ return localStorage.getItem(HEAD_MODE_KEY); }catch(e){}
  try{ return sessionStorage.getItem(HEAD_MODE_KEY); }catch(e){}
  return null;
}
function writeHeadMode(m){
  try{ localStorage.setItem(HEAD_MODE_KEY,m); return; }catch(e){}
  try{ sessionStorage.setItem(HEAD_MODE_KEY,m); return; }catch(e){}
}
function pickHeadMode(){
  var m=(readHeadMode()==='nearest')?'confirmed':'nearest';
  writeHeadMode(m);
  return m;
}
function refreshHeader(){
  if(hTimes===null) return;
  var summary=(headMode==='confirmed')?summaryConfirmed(hTimes,hWdg,hRaw,hIdx):buildSummary(hTimes,hWdg,hRaw,hIdx);
  var sensorTemp=widgetSensorTemp(hData,hIdx);
  var headParts = [];
  if (sensorTemp) headParts.push(sensorTemp);
  headParts.push(summary);
  cityEl.innerHTML = '<span class="cico">\uD83C\uDF24</span> ' + headParts.join(', ');
}

function fmtP(v){
  if(v==null) return '\u2014';
  return rnd(v*10)/10;
}

function temp(v){ return v==null ? '\u2014' : (rnd(v)>0?'+':'') + rnd(v) + '\u00B0'; }
function num(v){ return v==null ? '\u2014' : rnd(v); }
// Половины округляются от нуля — тем же правилом, что на главной странице
// (template.html). Math.round шёл к +∞, и -1.5° читался как -1° в виджете и
// как -2° в основной странице: одно число на одном сайте двумя способами.
function rnd(v){ return Math.sign(v)*Math.round(Math.abs(v)); }

// Стрелка ветра в шапке: ↑ повёрнут на (направление+180)° — куда дует ветер,
// а не откуда, — как в 10-дневной полосе. Скорость округляется до целых м/с
// тем же rnd. Нет скорости — пустая строка: в шапке ветер опускается целиком,
// а не показывается прочерком.
var WIND_RUMBS = ['\u0421','\u0421\u0412','\u0412','\u042E\u0412','\u042E','\u042E\u0417','\u0417','\u0421\u0417'];
function windArrow(wd, ws){
  if(ws == null) return '';
  var rot = (wd == null) ? null : (wd + 180) % 360;
  var arrow = (rot == null) ? '' :
    '<span class="warr" style="transform:rotate(' + Math.round(rot) + 'deg)" title="\u0412\u0435\u0442\u0435\u0440 \u043a ' + WIND_RUMBS[Math.round(rot / 45) % 8] + '">\u2191</span>';
  return arrow + rnd(ws);
}

var SENSOR_CODE = 'sensors';
var SENSOR_VARS = ['temperature_2m'];

// Минуты от полуночи для «ЧЧ:ММ». Границы окна получаются сдвигом на часы,
// поэтому сравнивать их строки бессмысленно — арифметика держит сдвиг видимым.
function hhmmMin(s){ return (+s.slice(0,2))*60+(+s.slice(3,5)); }
// Сдвиг окна среднего от рассвета и заката, минуты.
var SENSOR_MEAN_AFTER_SUNRISE = 180, SENSOR_MEAN_BEFORE_SUNSET = 120;

// Рассвет и закат для часа j в минутах от полуночи, либо null. Границы берутся
// для того дня, к которому принадлежит сам час: сравнение с сегодняшним
// закатом на границе суток посчитало бы ночь последнего часа по закату
// первого дня.
function sunMinutes(data, j){
  var iso = data.time ? data.time[j] : null;
  if(!iso) return null;
  var k = (data.daily_time || []).indexOf(iso.slice(0,10));
  if(k<0) return null;
  var dl = data.daily || {};
  var sr = dl.sunrise ? dl.sunrise[k] : null;
  var ss = dl.sunset ? dl.sunset[k] : null;
  if(!sr||!ss) return null;
  return {sr: hhmmMin(sr), ss: hhmmMin(ss)};
}
function hourMinutes(data, j){
  var iso = data.time ? data.time[j] : null;
  return iso ? hhmmMin(iso.slice(11,16)) : null;
}

// Список дождевых кодов — копия из buildSummary. Там он живёт внутри функции,
// и ссылаться на него отсюда нельзя: переменная с областью видимости function
// недоступна снаружи, и виджет падал с «RAIN is not defined».
var SENSOR_RAIN_CODES = [51,53,55,56,57,61,63,65,66,67,80,81,82];
function sensorHourWet(data, j){
  // Идут ли в час j осадки по консенсусу. Пороги те же, что в сводке по
  // дождю и на главной странице: дождевой код, либо не меньше 0.1 мм,
  // либо (когда осадков по сумме нет) вероятность выше 20%.
  var w = data.weighted || {};
  var c = w.weather_code ? w.weather_code[j] : null;
  var p = w.precipitation ? w.precipitation[j] : null;
  var q = w.precipitation_probability ? w.precipitation_probability[j] : null;
  return (c!=null && SENSOR_RAIN_CODES.indexOf(Math.round(c))>=0) ||
         (p!=null && p>=0.1) ||
         ((p==null || p<0.1) && q!=null && q>20);
}

function sensorShowsMean(data, j){
  // Окно среднего: с трёх часов после рассвета и до двух часов до заката.
  // Раньше границы стояли на рассвете и закате, и первые три часа утра
  // показывали минимум ночи, хотя солнце уже поднялось.
  // Второе условие — осадки, и оно перевешивает время суток: низина
  // остывает только под ясным небом, поэтому в дождь станции стоят рядом и
  // минимум приписал бы низине холод, которого не было.
  // Дефолт — среднее: обратный дефолт переключил бы округление там, где
  // данных просто не хватает, и заголовок изменился бы из-за отсутствия
  // прогноза.
  if(sensorHourWet(data, j)) return true;
  var b = sunMinutes(data, j);
  if(!b) return true;
  var h = hourMinutes(data, j);
  if(h==null) return true;
  return h>=b.sr+SENSOR_MEAN_AFTER_SUNRISE && h<b.ss-SENSOR_MEAN_BEFORE_SUNSET;
}

function sensorInDayWindow(data, j){
  // Старое окно рассвет–закат, без сдвигов. Значение по нему не выбирается:
  // Ярославль показывает среднее круглосуточно, и его округление не должно
  // поехать вместе с границами Цеденево.
  var b = sunMinutes(data, j);
  if(!b) return true;
  var h = hourMinutes(data, j);
  if(h==null) return true;
  return h>=b.sr && h<b.ss;
}

function roundSensorTemp(v){
  // Обычное округление до целых, по ближайшему. Раньше было направленное: вверх
  // для среднего и вниз для минимума, из-за чего 9.1 в виджете превращался в
  // «+10» и не сходился со строкой «По датчику» главной страницы, где та же
  // величина печатается как 9.1. Знак обрабатывается вручную: Math.round
  // округляет -2.5 к -2, то есть к нулю, а нужно от нуля.
  return Math.sign(v)*Math.round(Math.abs(v));
}

function widgetSensorTemp(data, idx){
  // Температура последнего наблюдения датчиков, а не прогноз: ищем назад от
  // текущего часа, как в lastSensorHour() главной страницы.
  var key = SENSOR_VARS[0];
  var sc = data.sensor_station_counts || null;
  var n = sc ? sc[key] : null;
  // Последний замер каждой станции, а не среднее часа: models[SENSOR_CODE]
  // остаётся средним для таблиц и графика главной.
  var v = data.sensor_now_value ? data.sensor_now_value.temperature_2m : null;
  var mn = data.sensor_now_min ? data.sensor_now_min.temperature_2m : null;
  var slug = data.location ? data.location.slug : null;
  if(!n||!v) return '';
  for(var j=idx;j>=0;j--){
    // Обе проверки обязательны: счётчик без значения и значение без счётчика
    // одинаково плохо описывают наблюдение.
    var x = v[j];
    if(n[j]>0 && x!=null){
      // Цеденево вне окна среднего и без осадков показывает минимум — то же
      // значение, что строка «Датчик» главной страницы, чтобы заголовок и
      // страница не расходились. У Ярославля величина всегда среднее.
      var showsMean = slug==='tsedenevo'
        ? sensorShowsMean(data, j)
        : sensorInDayWindow(data, j);
      var val = (slug==='tsedenevo' && !showsMean && mn && mn[j]!=null) ? mn[j] : x;
      var t = roundSensorTemp(val);
      return(t>0?'+':'')+t;
    }
  }
  return '';
}

function render(data){
  if (!data || !data.time || !data.weighted) return showError('\u041D\u0435\u0442 \u0434\u0430\u043D\u043D\u044B\u0445');

  // Сетка времени — стенное время города без смещения ('2026-09-30T17:00'),
  // поэтому new Date(t) читался по часам браузера, и посетителю из Токио
  // показывался не тот час. idx берём по городским часам, как на главной.
  var times = data.time.map(function(t){ return new Date(t); });
  var tz = (data.location && data.location.tz) ? data.location.tz : 'Europe/Moscow';
  var nowS = new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()).replace(', ','T');
  var curHour = nowS.slice(0,13) + ':00';

  var idx = -1;
  for (var i = 0; i < data.time.length; i++){
    if (data.time[i] <= curHour) idx = i;
    else break;
  }
  if (idx < 0) idx = 0;

  headMode=pickHeadMode();
  hTimes=times;hData=data;hWdg=data.weighted;hRaw=data.models;hIdx=idx;
  refreshHeader();

  var html = '';
  var cnt = Math.min(hours, times.length - idx);
  for (var h = 0; h < cnt; h++){
    var i = idx + h;
    var t = times[i];
    var code = data.weighted.weather_code ? Math.round(data.weighted.weather_code[i]) : 0;
    var w = WMO[code] || {e:'\uD83C\uDF21', l:'\u041A\u043E\u0434 ' + code};
    var temperature = rnd(data.weighted.temperature_2m ? data.weighted.temperature_2m[i] : 0);
    var wd = data.weighted.wind_direction_10m ? data.weighted.wind_direction_10m[i] : null;
    var ws = data.weighted.wind_speed_10m ? data.weighted.wind_speed_10m[i] : null;
    var prob = data.weighted.precipitation_probability ? Math.round(data.weighted.precipitation_probability[i]) : 0;
    var mm = data.weighted.precipitation ? data.weighted.precipitation[i] : 0;
    var rain = prob >= 50 || mm >= 0.1;
    var tempStr = (temperature > 0 ? '+' : '') + temperature + '\u00B0';

    var drop = (mm >= 0.05) ? '\uD83D\uDCA7' : '';
    var probStr = prob > 0 ? (drop + prob + '<span class="ppct">%</span>') : '';
    var mmStr = fmtMm(mm);

    html += '<div class="hour' + (rain ? ' rain' : '') + '" title="' + w.l + '">' +
      '<div class="ht">' + pad2(t.getHours()) + 'ч</div>' +
      '<div class="he">' + w.e + '</div>' +
      '<div class="hwnd">' + windArrow(wd, ws) + '</div>' +
      '<div class="htemp">' + tempStr + '</div>' +
      '<div class="hpp">' + probStr + '</div>' +
      '<div class="hmm">' + mmStr + '</div>' +
      '</div>';
  }
  strip.innerHTML = html;
  var bg = hourBgSvg(cnt);
  if (bg) strip.insertAdjacentHTML('afterbegin', bg);

  if (!data.daily_time || !data.daily){ d10strip.innerHTML = ''; return; }

  var days = data.daily_time;
  var daily = data.daily;
  // Дата «сегодня» — из сетки города, а не из часов браузера: в 03:00 по
  // Токио браузер уже на следующих сутках, и колонка «Сегодня» исчезала.
  var todayStr = (idx >= 0 && data.time[idx]) ? data.time[idx].slice(0,10) : nowS.slice(0,10);
  var arr = [];
  for (var di = 0; di < days.length; di++){
    var dateStr = days[di];
    if (dateStr < todayStr) continue;
    var d = new Date(dateStr + 'T12:00:00');
    var idx15 = -1;
    for (var j = 0; j < times.length; j++){
      if (times[j].toDateString() === d.toDateString() && times[j].getHours() === 15){ idx15 = j; break; }
    }
    var code2 = (idx15 >= 0 && data.weighted.weather_code) ? Math.round(data.weighted.weather_code[idx15]) : 0;
    var w2 = WMO[code2] || {e:'\uD83C\uDF21', l:'\u041A\u043E\u0434 ' + code2};
    var tmin = daily.temperature_2m_min ? daily.temperature_2m_min[di] : null;
    var tmax = daily.temperature_2m_max ? daily.temperature_2m_max[di] : null;
    var pr = daily.precipitation_sum ? daily.precipitation_sum[di] : null;
    var pp = daily.precipitation_probability_max ? daily.precipitation_probability_max[di] : null;
    var cl = daily.cloud_cover_mean ? daily.cloud_cover_mean[di] : null;
    var ws = daily.wind_speed_10m_max ? daily.wind_speed_10m_max[di] : null;
    var wd = daily.wind_direction_10m_dominant ? daily.wind_direction_10m_dominant[di] : null;
    arr.push({tmin:tmin,tmax:tmax,pr:pr,pp:pp,cl:cl,ws:ws,wd:wd,we:w2.e,d:d,ds:dateStr});
  }

  var lo = Infinity, hi = -Infinity;
  for (var i = 0; i < arr.length; i++){
    if (arr[i].tmin != null && arr[i].tmin < lo) lo = arr[i].tmin;
    if (arr[i].tmax != null && arr[i].tmax > hi) hi = arr[i].tmax;
  }
  if (!isFinite(lo) || !isFinite(hi) || hi <= lo){ lo = 0; hi = 30; }
  var span = hi - lo;
  var TOP = 19, BTM = 74 - 19;
  var SCALE = span > 0 ? (BTM - TOP) / span : 0;
  function yT(t){ return t == null ? BTM : (span > 0 ? BTM - SCALE * (t - lo) : (TOP + BTM) / 2); }

  // Стрелка ветра смотрит по ходу ветра, а не откуда он пришёл: градусы в API
  // задают направление, ОТКУДА дует, поэтому прибавляем 180.
  var RUMBS = ['\u0421','\u0421\u0412','\u0412','\u042E\u0412','\u042E','\u042E\u0417','\u0417','\u0421\u0417'];
  function windCell(wd, ws){
    if (ws == null) return '\u2014';
    var rot = wd == null ? null : (wd + 180) % 360;
    var arr = rot == null ? '' :
      '<span class="warr" style="transform:rotate(' + Math.round(rot) + 'deg)" title="\u0412\u0435\u0442\u0435\u0440 \u043A ' + RUMBS[Math.round(rot / 45) % 8] + '">\u2191</span>';
    return arr + (ws == null ? '' : rnd(ws));
  }

  var html10 = '';
  var dispDays = Math.min(arr.length, 16);
  for (var di = 0; di < dispDays; di++){
    var x = arr[di];
    var y1 = yT(x.tmax), y2 = yT(x.tmin);
    html10 += '<div class="d10col"><div class="d10tube">' +
      '<div class="d10tday" style="top:' + (y1-12) + 'px">' + temp(x.tmax) + '</div>' +
      '<div class="d10tnight" style="top:' + (y2+2) + 'px">' + temp(x.tmin) + '</div>' +
      '</div>' +
      '<div class="d10cond"><span class="ic">' + x.we + '</span></div>' +
      '<div class="d10wind">' + windCell(x.wd, x.ws) + '</div>' +
      '<div class="d10day"><b>' + DOW[x.d.getDay()] + '</b> ' + x.d.getDate() + '</div>' +
      '</div>';
  }
  d10strip.innerHTML = html10 + cloudRainSvgW(arr.slice(0, dispDays), 74);

  function hourBgSvg(cnt){
    var cc = [], pr = [];
    for (var h = 0; h < cnt; h++){
      var i = idx + h;
      var c = data.weighted.cloud_cover ? data.weighted.cloud_cover[i] : null;
      var r = data.weighted.precipitation ? data.weighted.precipitation[i] : null;
      var x = h / cnt * 100;
      if (c != null) cc.push(x.toFixed(2) + ',' + (c / 100 * 100).toFixed(1));
      if (r != null) pr.push(x.toFixed(2) + ',' + ((1 - Math.min(1, r / 5)) * 100).toFixed(1));
    }
    var out = '';
    if (cc.length >= 2){ var l = cc.join(' '); out += '<polygon points="' + l + ' 100,0 0,0" class="d10ccf"/>'; }
    if (pr.length >= 2){ out += '<polygon points="' + pr.join(' ') + ' 100,100 0,100" class="d10prf"/>'; }
    return out ? '<svg class="hobg" viewBox="0 0 100 100" preserveAspectRatio="none">' + out + '</svg>' : '';
  }

  function cloudRainSvgW(list, HGT){
    var N = list.length; if (!N) return '';
    var cc = [], pr = [];
    for (var di = 0; di < N; di++){
      var dref = new Date(list[di].ds + 'T12:00:00').toDateString();
      for (var j = 0; j < times.length; j++){
        var t = times[j];
        if (t.toDateString() !== dref) continue;
        var h = t.getHours();
        var c = data.weighted.cloud_cover ? data.weighted.cloud_cover[j] : null;
        var r = data.weighted.precipitation ? data.weighted.precipitation[j] : null;
        var x = (di * 24 + h) / (N * 24) * 100;
        if (c != null) cc.push(x.toFixed(2) + ',' + (c / 100 * HGT).toFixed(1));
        if (r != null) pr.push(x.toFixed(2) + ',' + ((1 - Math.min(1, r / 5)) * HGT).toFixed(1));
      }
    }
    var out = '';
    if (cc.length >= 2){ var l = cc.join(' '); out += '<polygon points="' + l + ' 100,0 0,0" class="d10ccf"/>'; }
    if (pr.length >= 2){ var l2 = pr.join(' '); out += '<polygon points="' + l2 + ' 100,' + HGT + ' 0,' + HGT + '" class="d10prf"/>'; }
    out += tempCurve(list, HGT);
    return '<svg class="d10svg" viewBox="0 0 100 ' + HGT + '" preserveAspectRatio="none">' + out + '</svg>';
  }

  function tempCurve(list, HGT){
    var pts = [];
    for (var di = 0; di < list.length; di++){
      var dref = new Date(list[di].ds + 'T12:00:00').toDateString();
      for (var j = 0; j < times.length; j++){
        var t = times[j];
        if (t.toDateString() !== dref) continue;
        var v = data.weighted.temperature_2m ? data.weighted.temperature_2m[j] : null;
        if (v == null) continue;
        var h = t.getHours();
        var x = (di * 24 + h) / (list.length * 24) * 100;
        pts.push({x:x, y:yT(v), v:v});
      }
    }
    if (pts.length < 2) return '';
    var crossed = [];
    for (var i = 0; i < pts.length - 1; i++){
      var a = pts[i], b = pts[i + 1];
      crossed.push(a);
      if ((a.v < 0 && b.v >= 0) || (a.v >= 0 && b.v < 0)){
        var f = a.v / (a.v - b.v);
        crossed.push({x:a.x + f * (b.x - a.x), y:a.y + f * (b.y - a.y), v:0});
      }
    }
    crossed.push(pts[pts.length - 1]);
    var red = '', blue = '';
    for (var i = 0; i < crossed.length - 1; i++){
      var a = crossed[i], b = crossed[i + 1];
      var seg = 'M' + a.x.toFixed(2) + ',' + a.y.toFixed(1) + 'L' + b.x.toFixed(2) + ',' + b.y.toFixed(1);
      if (b.v >= 0) red += (red ? ' ' : '') + seg; else blue += (blue ? ' ' : '') + seg;
    }
    var out = '';
    if (red) out += '<path d="' + red + '" class="d10cline" stroke="#e74c3c"/>';
    if (blue) out += '<path d="' + blue + '" class="d10cline" stroke="#3498db"/>';
    return out;
  }

  var gen = data.generated_at ? new Date(data.generated_at) : null;
  // generated_at несёт смещение +03:00, но getHours() печатал его по часам
  // браузера: в Токио один и тот же факт читался как 17:56 вместо 11:56.
  updEl.textContent = gen ? new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(gen) : '\u2014';
}

function showError(msg){
  strip.innerHTML = '<div class="err">\u26A0\uFE0F \u041D\u0435 \u0443\u0434\u0430\u043B\u043E\u0441\u044C \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044C \u0434\u0430\u043D\u043D\u044B\u0435' + (msg ? ' (' + msg + ')' : '') + '</div>';
  d10strip.innerHTML = '';
  updEl.textContent = '';
  cityEl.innerHTML = '<span class="cico">\uD83C\uDF24</span>';
}

function pad2(n){ return (n < 10 ? '0' : '') + n; }

function fmtMm(v){
  if (v == null || v < 0.05) return '0\u043C\u043C';
  var x = Math.round(v * 10) / 10;
  return (x >= 10 ? Math.round(x) : x.toFixed(1).replace('.', ',')) + '\u043C\u043C';
}

load();
(function scheduleAligned(fn, ms){
  var now = Date.now();
  setTimeout(function(){
    fn();
    scheduleAligned(fn, ms);
  }, Math.ceil(now / ms) * ms - now);
})(load, REFRESH_MS);
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) load();
});
})();
</script>
