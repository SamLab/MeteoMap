name: Collect station snapshot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sensors-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # По умолчанию checkout берёт github.sha - ревизию, зафиксированную
          # при СОЗДАНИИ прогона. Планировщик GitHub и внешний триггер могут
          # создать два прогона на одном sha: concurrency выстроит их по
          # очереди, но второй всё равно стартует от устаревшего коммита, и его
          # git push отвергнут как non-fast-forward (такое падение было
          # 29.09 в прогонах 36589188250 и 36592635918). ref: main берёт вершину
          # ветки в момент старта job, поэтому каждый прогон продолжает
          # предыдущий, а неделится с ним.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install paho-mqtt
        run: pip install paho-mqtt

      - name: Collect live station readings
        run: python tools/collect_sensors.py

      - name: Commit station history
        # Только history: sensors_history.json читает meteo.py, и это единственное
        # долговременное хранилище между прогонами (data/ в .gitignore, каждый
        # запуск CI — чистый checkout). Локальный снимок sensors.json коллектор
        # продолжает писать, но читает его теперь ноль страниц, поэтому в индекс
        # он не попадает.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # add до проверки: на первом прогоне файла в checkout ещё нет, и
          # git diff по неотслеживаемому файлу всегда молчит — решение «нечего
          # коммитить» было бы верным всегда, и история не закоммитилась бы
          # никогда.
          git add sensors_history.json
          if git diff --cached --quiet -- sensors_history.json; then
            echo "sensors_history.json unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore: refresh station history"
          # push с перечитыванием ветки и тремя попытками. Прогон живёт 10 минут
          # (600 с слушает MQTT), всё это время main лежит в копии, взятой
          # checkout в начале окна, поэтому любой чужой коммит, прилетевший за
          # окно, обесценивает push. Наблюдалось дважды: 36603661593 и
          # 36605470404 упали с "! [rejected] main -> main (fetch first)".
          # ref: main выше спасает только от гонки CI-против-CI и от человека не
          # спасает — ребейз перед push нужен сам по себе, а || нужен потому,
          # что между ребейзом и push ветку снова может сдвинуть тот же человек.
          # Rebase вместо merge: свой коммит содержит одну строку файла истории,
          # merge тащил бы в граф commit merge с тем же сообщением.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push отклонён, ветка сдвинулась (попытка $attempt из 3)"
            git pull --rebase origin main
          done
          echo "push не прошёл после трёх попыток"
          exit 1
