name: Collect station snapshot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sensors-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install paho-mqtt
        run: pip install paho-mqtt

      - name: Collect live station readings
        run: python tools/collect_sensors.py

      - name: Commit snapshot
        run: |
          if git diff --quiet -- sensors.json; then
            echo "sensors.json unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sensors.json
          git commit -m "chore: refresh station snapshot"
          git push
