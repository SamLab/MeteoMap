name: Deploy MeteoMap to Pages

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -m "not integration" -q

      - name: Generate site
        env:
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          VISUALCROSSING_KEY: ${{ secrets.VISUALCROSSING_KEY }}
          METEOBLUE_KEY: ${{ secrets.METEOBLUE_KEY }}
          ENABLE_EXTERNAL: "1"
        run: python meteo.py

      - name: Build radar page
        run: python tools/build_radar.py

      - name: Prepare pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp radar.html _site/
          cp meteo.html _site/
          cp -r data _site/
          echo "" > _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
